spec:
  containers:
    - name: slack-cortex-bot
      image: <YOUR_ORG>-<YOUR_ACCOUNT>.registry.snowflakecomputing.com/<DB>/<SCHEMA>/<REPO>/slack-bot:latest
      
      # Mount the OAuth token (This happens automatically, but good to know)
      # The token is available at /snowflake/session/token
      
      env:
        # Pass non-secret config here
        AGENT_ENDPOINT: "https://<your_cortex_endpoint>"
        ALLOWED_USERS: "U123456,U987654" # Comma separated Slack User IDs
        # Snowflake env vars are often injected automatically, but you can force them:
        # SNOWFLAKE_WAREHOUSE: "MY_WH" 
        
      secrets:
        # Map Snowflake secrets to Environment Variables
        - snowflakeSecret: SLACK_APP_TOKEN_SECRET
          secretEnv: SLACK_APP_TOKEN
        - snowflakeSecret: SLACK_BOT_TOKEN_SECRET
          secretEnv: SLACK_BOT_TOKEN
          
      resources:
        requests:
          memory: 1G
          cpu: 0.5
        limits:
          memory: 2G
          cpu: 1